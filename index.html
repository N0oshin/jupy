<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <title>Jupyter Labs — HPLC-Verified Research-Grade Peptides</title>
    <meta
      name="description"
      content="Jupyter Labs supplies research-grade peptides — HPLC-verified for purity, traceable to the lot, and documented to the milligram. For laboratory R&D use only."
    />
    <meta name="keywords" content="research peptides, HPLC-verified peptides, BPC-157, retatrutide, tirzepatide, GHK-Cu, research-grade peptides, COA, laboratory R&D" />
    <meta name="author" content="Jupyter Labs" />
    <link rel="canonical" href="https://jupyterlabs.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jupyterlabs.example.com/" />
    <meta property="og:site_name" content="Jupyter Labs" />
    <meta property="og:title" content="Jupyter Labs — HPLC-Verified Research-Grade Peptides" />
    <meta property="og:description" content="Research-grade peptides — HPLC-verified for purity, traceable to the lot, documented to the milligram. For laboratory R&D use only." />
    <meta property="og:image" content="https://jupyterlabs.example.com/images/hero-imgnew.webp" />
    <meta property="og:image:alt" content="Jupyter Labs research-grade peptides" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jupyter Labs — HPLC-Verified Research-Grade Peptides" />
    <meta name="twitter:description" content="Research-grade peptides — HPLC-verified, lot-traceable, documented to the milligram. For laboratory R&D use only." />
    <meta name="twitter:image" content="https://jupyterlabs.example.com/images/hero-imgnew.webp" />

    <!-- LCP image. This is an SPA: without an explicit preload the hero is not
         discoverable until React has parsed, executed and rendered, which idles
         the network through the entire critical path. imagesrcset mirrors the
         <img> in Hero.tsx so the preload and the render resolve to one file. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/images/jupyter-labs/jupyter-labs-research-grade-peptides-hero.webp"
      imagesrcset="
        /images/jupyter-labs/jupyter-labs-research-grade-peptides-hero-640.webp   640w,
        /images/jupyter-labs/jupyter-labs-research-grade-peptides-hero-1024.webp 1024w,
        /images/jupyter-labs/jupyter-labs-research-grade-peptides-hero-1536.webp 1536w,
        /images/jupyter-labs/jupyter-labs-research-grade-peptides-hero.webp      2048w"
      imagesizes="100vw"
    />

    <!-- Font: Space Grotesk, self-hosted (see @font-face in src/index.css).
         Preloaded so the fetch starts with the HTML rather than waiting for the
         stylesheet to parse. Only the latin subset is preloaded — it is the one
         English content actually resolves to. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-latin.woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://jupyterlabs.example.com/#organization",
            "name": "Jupyter Labs",
            "url": "https://jupyterlabs.example.com/",
            "description": "Research-grade peptides — HPLC-verified for purity, traceable to the lot, documented to the milligram. For laboratory R&D use only.",
            "slogan": "Pharmaceutical rigor, in every batch.",
            "logo": "https://jupyterlabs.example.com/favicon.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://jupyterlabs.example.com/#website",
            "url": "https://jupyterlabs.example.com/",
            "name": "Jupyter Labs",
            "publisher": { "@id": "https://jupyterlabs.example.com/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
