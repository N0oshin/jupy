  <head>
    <meta charset="UTF-8" />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    />

    <link rel="canonical" href="https://jupyterlabs.net/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jupyterlabs.net/" />
    <meta property="og:site_name" content="Jupyter Labs" />
    <meta property="og:title" content="HPLC-Verified Research Peptides | Jupyter Labs" />
    <meta property="og:description" content="Research-grade peptides HPLC-verified for purity, traceable to the lot, and documented to the milligram." />
    <meta property="og:image" content="https://jupyterlabs.net/images/hero-imgnew.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HPLC-Verified Research Peptides | Jupyter Labs" />

    <meta name="twitter:image" content="https://jupyterlabs.net/images/hero-imgnew.webp" />

    <!-- LCP image. This is an SPA: without an explicit preload the hero is not
         discoverable until React has parsed, executed and rendered, which idles
         the network through the entire critical path. the href matches the
         <img> in Hero.tsx so the preload and the render resolve to one file. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/images/ecom/hero-trio-pens.webp"
    />

    <!-- Fonts: Playfair Display, Bodoni Moda (hero heading), Cormorant Garamond and Montserrat, self-hosted (see
         @font-face in src/index.css). Only the two faces used above the fold are
         preloaded, and only the latin subset, which is what English text resolves to. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-latin-normal-300-600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bodoni-moda-latin-normal-400-900.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-latin-normal-400-700.woff2" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://jupyterlabs.net/#organization",
            "name": "Jupyter Labs",
            "url": "https://jupyterlabs.net/",
            "description": "Research-grade peptides HPLC-verified for purity, traceable to the lot, and documented to the milligram.",

          },

            "name": "Jupyter Labs",
            "publisher": { "@id": "https://jupyterlabs.net/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
